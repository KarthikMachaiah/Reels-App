# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC --enable-native-access=ALL-UNNAMED

# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true

# KSP compatibility with AGP 9 built-in Kotlin:
# KSP registers generated sources via kotlin.sourceSets DSL; this flag allows it.
# Remove once KSP fully migrates to android.sourceSets DSL (tracked in KSP issue #1)
android.disallowKotlinSourceSets=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself and none from the library's
# dependencies, thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true

# Enable Gradle build cache
org.gradle.caching=true

# Configuration cache — disabled due to Java 25 parser caching issues
# org.gradle.configuration-cache=true

# Enable parallel execution
org.gradle.parallel=true

# Use daemon for faster builds
org.gradle.daemon=true

# KSP incremental processing
ksp.incremental=true
ksp.incremental.intermodule=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
